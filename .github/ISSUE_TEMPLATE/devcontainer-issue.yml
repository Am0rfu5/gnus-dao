name: "🐳 DevContainer Issue"
description: "Report issues with DevContainer setup, performance, or functionality"
title: "[DevContainer] "
labels: ["devcontainer", "bug"]
body:
  - type: markdown
    attributes:
      value: |
        ## 🐳 DevContainer Issue Report

        Thanks for reporting a DevContainer issue! This template will help us diagnose and resolve your problem quickly.

        **Before submitting:**
        - [ ] I've checked the [troubleshooting guide](../docs/devcontainer/troubleshooting/common-issues.md)
        - [ ] I've run the [diagnostic tool](scripts/devops/gh-devcon/diagnose-devcontainer-issues.ts)
        - [ ] I've searched existing issues for similar problems

  - type: dropdown
    id: issue-type
    attributes:
      label: Issue Type
      description: What type of issue are you experiencing?
      options:
        - Setup/Installation Problem
        - Performance Issue
        - Configuration Error
        - Build/Compilation Failure
        - Runtime Error
        - Security Tool Issue
        - Network/Connectivity Problem
        - Extension/IDE Integration Issue
        - Documentation Issue
        - Other
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      description: How severely does this issue impact your work?
      options:
        - Critical - Completely blocks development
        - High - Major workflow disruption
        - Medium - Noticeable but workable
        - Low - Minor inconvenience
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: Environment
      description: Where are you experiencing this issue?
      options:
        - Local DevContainer (VS Code)
        - GitHub Actions CI/CD
        - Local development outside DevContainer
        - Production deployment
        - Other
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating System
      description: What OS are you using? (e.g., macOS 12.6, Windows 11, Ubuntu 22.04)
      placeholder: "macOS 12.6.1"
    validations:
      required: true

  - type: input
    id: devcontainer-version
    attributes:
      label: DevContainer Version/Commit
      description: What version of the DevContainer are you using?
      placeholder: "main branch, commit abc123, or version tag"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Issue Description
      description: Provide a clear, detailed description of the issue
      placeholder: |
        ## What happened?
        Describe what you were trying to do and what went wrong.

        ## Expected behavior
        What should have happened?

        ## Actual behavior
        What actually happened?

        ## Steps to reproduce
        1. Step 1
        2. Step 2
        3. Step 3
    validations:
      required: true

  - type: textarea
    id: error-logs
    attributes:
      label: Error Logs/Output
      description: Include any error messages, logs, or console output
      placeholder: |
        ```
        Paste error logs here
        ```
      render: shell

  - type: textarea
    id: diagnostic-output
    attributes:
      label: Diagnostic Information
      description: Run the diagnostic tool and paste the output here
      placeholder: |
        ```bash
        npx ts-node scripts/devops/gh-devcon/diagnose-devcontainer-issues.ts --comprehensive
        ```

        Paste the diagnostic output here, or describe what you found.
    validations:
      required: false

  - type: textarea
    id: attempted-solutions
    attributes:
      label: Attempted Solutions
      description: What have you tried to fix this issue?
      placeholder: |
        - Tried restarting Docker Desktop
        - Cleared Docker cache with `docker system prune -a`
        - Rebuilt DevContainer
        - Checked troubleshooting guide
        - Other attempts...
    validations:
      required: false

  - type: dropdown
    id: blocking
    attributes:
      label: Is this blocking your work?
      description: Does this issue prevent you from being productive?
      options:
        - "Yes - completely blocking"
        - "Partially - can work around it"
        - "No - minor issue"
    validations:
      required: true

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Any other information that might be helpful
      placeholder: |
        - Hardware specifications (RAM, CPU, etc.)
        - Network environment (corporate proxy, VPN, etc.)
        - Recent changes to your environment
        - Screenshots (if applicable)
        - Related issues or PRs
    validations:
      required: false

  - type: checkboxes
    id: verification
    attributes:
      label: Verification
      description: Please verify these before submitting
      options:
        - label: I have read the [troubleshooting guide](../docs/devcontainer/troubleshooting/common-issues.md)
          required: true
        - label: I have run the diagnostic tool and included the output
          required: true
        - label: I have searched for similar existing issues
          required: true
        - label: This issue is not a duplicate
          required: true

  - type: markdown
    attributes:
      value: |
        ## Next Steps

        After submitting this issue:

        1. **Automated Triage**: Our system will automatically categorize and prioritize your issue
        2. **Initial Response**: You'll receive an acknowledgment within 2 hours during business hours
        3. **Investigation**: Our team will investigate and provide a fix or workaround
        4. **Resolution**: Most issues are resolved within 24-48 hours

        ## Emergency Support

        For critical production-blocking issues:
        - Tag this issue with `🔴 critical` label
        - Contact the DevContainer support team directly in #devcontainer-support Slack channel
        - Call emergency hotline: +1-XXX-XXX-XXXX (available 24/7)

        ## Related Resources

        - [Quick Start Guide](../docs/devcontainer/quick-start/README.md)
        - [Troubleshooting Guide](../docs/devcontainer/troubleshooting/common-issues.md)
        - [Interactive Walkthrough](scripts/devops/gh-devcon/interactive-walkthrough.ts)
        - [Knowledge Base](../docs/support/knowledge-base.md)