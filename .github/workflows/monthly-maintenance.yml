name: Monthly Maintenance
on:
  schedule:
    # Run monthly on the 1st at 4 AM UTC
    - cron: '0 4 1 * *'
  workflow_dispatch:

jobs:
  comprehensive-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      security-events: write
      actions: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0  # Full history for comprehensive audit

      - name: Setup Environment
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'yarn'

      - name: Install Dependencies
        run: yarn install --frozen-lockfile

      - name: Run Comprehensive Audit
        run: |
          echo "🔍 Running comprehensive monthly audit..."

          # Security audit
          yarn security-audit

          # Code quality audit
          yarn code-quality-audit

          # Performance audit
          yarn performance-audit

          # Dependency audit
          yarn dependency-audit

          echo "✅ Comprehensive audit completed"

      - name: Generate Audit Report
        run: |
          echo "## 📊 Monthly Comprehensive Audit Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Audit Type | Status | Findings | Recommendations |" >> $GITHUB_STEP_SUMMARY
          echo "|------------|--------|----------|----------------|" >> $GITHUB_STEP_SUMMARY

          if [ -f audit-report.json ]; then
            # Parse and display audit results
            echo "| Security Audit | $(jq -r '.security.status' audit-report.json) | $(jq -r '.security.findings' audit-report.json) | $(jq -r '.security.recommendations' audit-report.json) |" >> $GITHUB_STEP_SUMMARY
            echo "| Code Quality | $(jq -r '.quality.status' audit-report.json) | $(jq -r '.quality.findings' audit-report.json) | $(jq -r '.quality.recommendations' audit-report.json) |" >> $GITHUB_STEP_SUMMARY
            echo "| Performance | $(jq -r '.performance.status' audit-report.json) | $(jq -r '.performance.findings' audit-report.json) | $(jq -r '.performance.recommendations' audit-report.json) |" >> $GITHUB_STEP_SUMMARY
            echo "| Dependencies | $(jq -r '.dependencies.status' audit-report.json) | $(jq -r '.dependencies.findings' audit-report.json) | $(jq -r '.dependencies.recommendations' audit-report.json) |" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "*This audit was automatically generated by the monthly maintenance workflow.*" >> $GITHUB_STEP_SUMMARY

      - name: Create Audit Issue (if needed)
        if: always()
        run: |
          # Check if audit report indicates issues
          if [ -f audit-report.json ]; then
            ISSUES_FOUND=$(jq '[.security,.quality,.performance,.dependencies] | map(select(.status == "error" or .status == "warning")) | length > 0' audit-report.json)

            if [ "$ISSUES_FOUND" = "true" ]; then
              echo "📊 Creating audit issue for review..."
              # Issue creation would go here
            fi
          fi

  license-compliance-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check License Compliance
        run: |
          echo "⚖️ Checking license compliance..."

          # Check for license files
          if [ ! -f LICENSE ] && [ ! -f LICENSE.md ]; then
            echo "⚠️ No license file found"
            exit 1
          fi

          # Check license headers in source files
          MISSING_HEADERS=$(find contracts src -name "*.sol" -o -name "*.ts" -o -name "*.js" | head -10 | xargs grep -L "SPDX-License-Identifier" || true)

          if [ -n "$MISSING_HEADERS" ]; then
            echo "⚠️ Files missing license headers:"
            echo "$MISSING_HEADERS"
          else
            echo "✅ License compliance check passed"
          fi

  backup-and-archive:
    runs-on: ubuntu-latest
    steps:
      - name: Create Monthly Backup
        run: |
          echo "💾 Creating monthly backup..."

          # Create backup of important files
          BACKUP_DIR="backup-$(date +%Y%m)"
          mkdir -p "$BACKUP_DIR"

          # Backup configurations
          cp -r .github "$BACKUP_DIR/"
          cp -r scripts "$BACKUP_DIR/"
          cp -r docs "$BACKUP_DIR/"

          # Create archive
          tar -czf "${BACKUP_DIR}.tar.gz" "$BACKUP_DIR"
          rm -rf "$BACKUP_DIR"

          echo "✅ Monthly backup created: ${BACKUP_DIR}.tar.gz"

  cost-analysis-and-optimization:
    runs-on: ubuntu-latest
    steps:
      - name: Monthly Cost Analysis
        run: |
          echo "💰 Running monthly cost analysis..."

          # Generate comprehensive cost report
          yarn cost-analyzer --timeframe=month

          # Check cost trends
          if [ -f cost-analysis-month.json ]; then
            COST_TREND=$(jq -r '.budgetStatus' cost-analysis-month.json)

            if [ "$COST_TREND" = "exceeded" ]; then
              echo "🚨 Monthly budget exceeded!"

              # Create cost optimization issue
              echo "Creating cost optimization issue..."
            fi
          fi

          echo "✅ Monthly cost analysis completed"