name: Security Tool Updates
on:
  schedule:
    # Run weekly on Monday at 2 AM UTC
    - cron: '0 2 * * 1'
  workflow_dispatch:
    inputs:
      force_update:
        description: 'Force update all tools regardless of current version'
        required: false
        default: false
        type: boolean

jobs:
  update-tools:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'yarn'

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'

      - name: Install Dependencies
        run: yarn install --frozen-lockfile

      - name: Install Python Tools
        run: |
          pip install --upgrade pip
          pip install slither-analyzer semgrep

      - name: Install Go Tools
        run: go install github.com/google/osv-scanner/cmd/osv-scanner@latest

      - name: Install NPM Tools
        run: npm install -g snyk

      - name: Run Security Tool Updates
        id: update
        run: |
          if [ "${{ github.event.inputs.force_update }}" = "true" ]; then
            export FORCE_UPDATE=true
          fi

          node scripts/security-tool-updater.js
        env:
          FORCE_UPDATE: ${{ github.event.inputs.force_update }}

      - name: Generate Update Summary
        id: summary
        run: |
          if [ -f security-tool-update-report.json ]; then
            SUCCESS_RATE=$(jq '.successRate' security-tool-update-report.json)
            UPDATES_COUNT=$(jq '.summary.successful' security-tool-update-report.json)

            echo "success_rate=$SUCCESS_RATE" >> $GITHUB_OUTPUT
            echo "updates_count=$UPDATES_COUNT" >> $GITHUB_OUTPUT

            echo "## 🔄 Security Tool Update Summary" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "- **Success Rate**: ${SUCCESS_RATE}%" >> $GITHUB_STEP_SUMMARY
            echo "- **Tools Updated**: $UPDATES_COUNT" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY

            # Show update details
            jq -r '.updates[] | "- \(.tool): \(.current) → \(.latest) (\(.status))"' security-tool-update-report.json >> $GITHUB_STEP_SUMMARY
          fi

      - name: Check for Changes
        id: changes
        run: |
          if git diff --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Create Pull Request
        if: steps.changes.outputs.has_changes == 'true' && steps.summary.outputs.success_rate >= 95
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: |
            🔄 Automated Security Tool Updates

            - Updated security tools to latest versions
            - Success rate: ${{ steps.summary.outputs.success_rate }}%
            - Tools updated: ${{ steps.summary.outputs.updates_count }}

            This PR was automatically generated by the security tool update workflow.
          title: '🔄 Automated Security Tool Updates'
          body: |
            ## 🔄 Automated Security Tool Updates

            This pull request contains automated updates to security tools used in the CI/CD pipeline.

            ### Summary
            - **Success Rate**: ${{ steps.summary.outputs.success_rate }}%
            - **Tools Updated**: ${{ steps.summary.outputs.updates_count }}
            - **Generated**: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            ### Changes
            - Updated `.tool-versions` file with latest tool versions
            - Updated security tool configurations if needed

            ### Validation
            - All updates completed with ≥95% success rate
            - Tool versions verified after update
            - No breaking changes to existing functionality

            ---
            🤖 This PR was automatically created by the Security Tool Update workflow.
          branch: automated/security-tool-updates
          delete-branch: true
          labels: |
            automated
            security
            dependencies

      - name: Alert on Low Success Rate
        if: steps.summary.outputs.success_rate < 95
        run: |
          curl -X POST ${{ secrets.SLACK_WEBHOOK }} \
            -H 'Content-type: application/json' \
            -d "{
              \"text\":\"⚠️ Security tool update failed: ${{ steps.summary.outputs.success_rate }}% success rate\",
              \"attachments\":[{
                \"color\":\"danger\",
                \"fields\":[
                  {\"title\":\"Success Rate\",\"value\":\"${{ steps.summary.outputs.success_rate }}%\",\"short\":true},
                  {\"title\":\"Workflow\",\"value\":\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\",\"short\":false}
                ]
              }]
            }"

      - name: Upload Update Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-tool-update-report
          path: security-tool-update-report.json
          retention-days: 30