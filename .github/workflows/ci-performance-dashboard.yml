name: CI Performance Dashboard
on:
  schedule:
    # Run daily at 6 AM UTC
    - cron: '0 6 * * *'
  workflow_dispatch:
  workflow_run:
    workflows: ["CI", "Security"]
    types: [completed]

jobs:
  generate-dashboard:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Enable Corepack
        run: corepack enable

      - name: Install Dependencies
        run: yarn install --frozen-lockfile

      - name: Generate Performance Dashboard
        id: dashboard
        run: |
          yarn ci-performance-dashboard

          # Check if dashboard was generated successfully
          if [ -f ci-performance-dashboard.md ]; then
            echo "dashboard_generated=true" >> $GITHUB_OUTPUT
          else
            echo "dashboard_generated=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload Dashboard Artifacts
        if: steps.dashboard.outputs.dashboard_generated == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ci-performance-dashboard
          path: |
            ci-performance-dashboard.json
            ci-performance-dashboard.md
          retention-days: 30

      - name: Extract Key Metrics
        id: metrics
        if: steps.dashboard.outputs.dashboard_generated == 'true'
        run: |
          # Extract key metrics from the dashboard
          if [ -f ci-performance-dashboard.json ]; then
            WORKFLOW_SUCCESS_RATE=$(jq -r '.dashboard.summary.workflow.successRate // "N/A"' ci-performance-dashboard.json)
            CACHE_HIT_RATE=$(jq -r '.dashboard.summary.cache.currentHitRate // "N/A"' ci-performance-dashboard.json)
            ALERT_COUNT=$(jq -r '.dashboard.alerts | length' ci-performance-dashboard.json)
            RECOMMENDATION_COUNT=$(jq -r '.dashboard.recommendations | length' ci-performance-dashboard.json)

            echo "workflow_success_rate=$WORKFLOW_SUCCESS_RATE" >> $GITHUB_OUTPUT
            echo "cache_hit_rate=$CACHE_HIT_RATE" >> $GITHUB_OUTPUT
            echo "alert_count=$ALERT_COUNT" >> $GITHUB_OUTPUT
            echo "recommendation_count=$RECOMMENDATION_COUNT" >> $GITHUB_OUTPUT
          fi

      - name: Create Performance Issue
        if: steps.metrics.outputs.alert_count > 0 && github.event_name == 'schedule'
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');

            // Read dashboard data
            const dashboardContent = fs.readFileSync('ci-performance-dashboard.md', 'utf8');
            const dashboardJson = JSON.parse(fs.readFileSync('ci-performance-dashboard.json', 'utf8'));

            const alerts = dashboardJson.dashboard.alerts;
            const recommendations = dashboardJson.dashboard.recommendations;

            // Check if there's already an open performance issue
            const existingIssues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: ['ci-performance', 'automated'],
              state: 'open'
            });

            if (existingIssues.data.length > 0) {
              // Update existing issue
              const issue = existingIssues.data[0];
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `## 🔄 Performance Dashboard Update

            ${dashboardContent}

            ---
            🤖 This update was automatically generated by the CI Performance Dashboard workflow.`
              });
            } else {
              // Create new issue
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: '🚀 CI Performance Dashboard - Action Required',
                body: `## 🚀 CI Performance Dashboard

            ${dashboardContent}

            ### 📊 Key Metrics
            - **Workflow Success Rate**: ${{ steps.metrics.outputs.workflow_success_rate }}%
            - **Cache Hit Rate**: ${{ steps.metrics.outputs.cache_hit_rate }}%
            - **Active Alerts**: ${{ steps.metrics.outputs.alert_count }}
            - **Recommendations**: ${{ steps.metrics.outputs.recommendation_count }}

            ### 🔗 Links
            - [View Dashboard](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            - [Download Artifacts](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}#artifacts)

            ---
            🤖 This issue was automatically created by the CI Performance Dashboard workflow.`,
                labels: ['ci-performance', 'automated', 'enhancement']
              });
            }

      - name: Update Dashboard Summary
        if: steps.dashboard.outputs.dashboard_generated == 'true'
        run: |
          echo "## 🚀 CI Performance Dashboard" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|--------|" >> $GITHUB_STEP_SUMMARY

          if [ "${{ steps.metrics.outputs.workflow_success_rate }}" != "N/A" ]; then
            STATUS=$([ "${{ steps.metrics.outputs.workflow_success_rate }}" -ge 95 ] && echo "✅" || echo "⚠️")
            echo "| Workflow Success Rate | ${{ steps.metrics.outputs.workflow_success_rate }}% | $STATUS |" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ steps.metrics.outputs.cache_hit_rate }}" != "N/A" ]; then
            STATUS=$([ "${{ steps.metrics.outputs.cache_hit_rate }}" -ge 70 ] && echo "✅" || echo "⚠️")
            echo "| Cache Hit Rate | ${{ steps.metrics.outputs.cache_hit_rate }}% | $STATUS |" >> $GITHUB_STEP_SUMMARY
          fi

          echo "| Active Alerts | ${{ steps.metrics.outputs.alert_count }} | $([ "${{ steps.metrics.outputs.alert_count }}" -gt 0 ] && echo "⚠️" || echo "✅") |" >> $GITHUB_STEP_SUMMARY
          echo "| Recommendations | ${{ steps.metrics.outputs.recommendation_count }} | 💡 |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "[📊 View Full Dashboard](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY

      - name: Alert on Critical Issues
        if: steps.metrics.outputs.alert_count > 0
        run: |
          # Send alert for critical performance issues
          curl -X POST ${{ secrets.SLACK_WEBHOOK }} \
            -H 'Content-type: application/json' \
            -d "{
              \"text\":\"🚨 CI Performance Alert: ${{ steps.metrics.outputs.alert_count }} issues detected\",
              \"attachments\":[{
                \"color\":\"warning\",
                \"fields\":[
                  {\"title\":\"Workflow Success Rate\",\"value\":\"${{ steps.metrics.outputs.workflow_success_rate }}%\",\"short\":true},
                  {\"title\":\"Cache Hit Rate\",\"value\":\"${{ steps.metrics.outputs.cache_hit_rate }}%\",\"short\":true},
                  {\"title\":\"Active Alerts\",\"value\":\"${{ steps.metrics.outputs.alert_count }}\",\"short\":true},
                  {\"title\":\"Dashboard\",\"value\":\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\",\"short\":false}
                ]
              }]
            }"